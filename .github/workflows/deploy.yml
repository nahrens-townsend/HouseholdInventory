name: Build, Migrate & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  API_PROJECT: "src/Inventory.Api"
  INFRA_PROJECT: "src/Inventory.Infrastructure"
  SOLUTION: "HouseholdInventory.slnx"

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Build & publish
  # ─────────────────────────────────────────────
  build:
    name: Build & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --no-restore --configuration Release

      - name: Publish API
        run: >
          dotnet publish ${{ env.API_PROJECT }}
          --no-restore
          --configuration Release
          --output ./publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: ./publish

  # ─────────────────────────────────────────────
  # JOB 2: Run EF Core migrations
  # ─────────────────────────────────────────────
  migrate:
    name: Apply EF Migrations
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install EF Core CLI tools
        run: dotnet tool install --global dotnet-ef

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build (required by EF tooling)
        run: dotnet build ${{ env.SOLUTION }} --no-restore --configuration Release

      - name: Apply migrations
        env:
          # The connection string is stored as a GitHub Secret.
          # It is injected as an environment variable that EF Core picks up
          # via the standard ASP.NET Core configuration system.
          ConnectionStrings__Default: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
          ASPNETCORE_ENVIRONMENT: Production
        run: >
          dotnet ef database update
          --project ${{ env.INFRA_PROJECT }}
          --startup-project ${{ env.API_PROJECT }}
          --configuration Release
          --no-build

  # ─────────────────────────────────────────────
  # JOB 3: Deploy to Azure App Service
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: migrate
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: api-publish
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_54A29503CD8D4A52B2CE6D466FE68F55 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_95792C5ABB634C308B059D6F77283BB2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0C0E5F67EA024349A9C35AFAEEB120C9 }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          package: ./publish
